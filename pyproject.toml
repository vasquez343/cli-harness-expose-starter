[project]
name = "cli-harness-expose-starter"
version = "0.1.0"
description = "Caddy → authenticated FastAPI daemon → non-interactive CLI harness"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "anyio>=4,<5"]

[project.scripts]
agentd = "agentd.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
